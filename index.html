<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F26B1F" />
    <meta name="description" content="Snap any menu and instantly get Swipe Mode for easy menu reading, dish photos, calories, smart picks, badges, and shareable food status. Yumz turns ordering into confidence." />

    <!-- Webfonts: Inter (body) + Fraunces (display headlines).
         Preconnect saves ~100ms of DNS+TLS on first paint; display=swap prevents FOIT. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist (display) + Inter (body) + Geist Mono (AI accents).
         Geist replaces editorial Fraunces — cleaner, app-native, modern AI feel. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yumz.social" />
    <meta property="og:title" content="Yumz — Snap Any Menu. See Every Dish." />
    <meta property="og:description" content="Swipe Mode for easy menu reading, calorie tracking, smart picks, badges, and shareable food status — Yumz turns ordering into confidence." />
    <meta property="og:image" content="https://yumz.social/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://yumz.social/og-image.png" />

    <title>Yumz — Snap Any Menu. See Every Dish.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
